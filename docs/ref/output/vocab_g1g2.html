function unitHtml(u, words) {
  return `<div class="unit"><div class="unit-head">${u}</div>` +
    words.map(([en, ipa, zh]) =>
      `<div class="word"><span class="en">${en}</span><span class="ipa">/${ipa}/</span><span class="zh">${zh}</span></div>`
    ).join('') + '</div>'
}
for (const [gid, units] of Object.entries(DATA)) {
  const el = document.getElementById(gid)
  // 按「词数+1(标题)」贪心均衡分到三列，保证打印时不跨页溢出
  const heights = units.map(([, w]) => w.length + 1)
  const total = heights.reduce((a, b) => a + b, 0)
  const target = Math.ceil(total / 3)
  const cols = [[]]
  let cur = 0
  for (let i = 0; i < units.length; i += 1) {
    if (cur > 0 && cur + heights[i] > target && cols.length < 3) { cols.push([]); cur = 0 }
    cols[cols.length - 1].push(i)
    cur += heights[i]
  }
  el.innerHTML = cols.map((idxs) =>
    `<div class="col">${idxs.map((i) => unitHtml(units[i][0], units[i][1])).join('')}</div>`
  ).join('')
}
