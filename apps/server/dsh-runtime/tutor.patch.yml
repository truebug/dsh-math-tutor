# dsh-math-tutor patch 叠加层（dsh 0.1.5 线，profile 'sdk' + --patch 机制）
# base profile 自带 llm/session/持久化/工具/凭证全套，本文件只覆盖差异项。
# Kimi 网关/key 由宿主进程经 DEEPSEEK_BASE_URL / DEEPSEEK_API_KEY env 注入（零 patch）。
#
# 安全边界：本服务是儿童家教场景，模型只需要“读提示词、回文本”，不需要
# bash/文件/网页/子代理/目标/计划等通用 Agent 工具。关闭这些行可同时：
#   1) 把每个请求的 request/header 从 ~25KB 降到 1-2KB；
#   2) 消除提示注入后读取 .env / 外联的路径；
#   3) 避免模型把一次 60 字讲解变成多轮工具调用。
# 注意：保留 tools 注册表本身、session、持久化、system-prompt、token-meter 与
# compaction-basic；不要改用 dsh-sdk-minimal（它仍挂 terminal/persistent-bash，
# 且 sandbox 默认 danger-full-access）。
- id: llm-deepseek
  config:
    thinking: disabled            # Kimi coding 端点不支持 thinking
    models:
      - id: k3
        name: Kimi-K3
        contextWindow: 262144
    # 儿童家教请求要快：只对网络/服务端瞬时错误重试一次；
    # RATE_LIMIT（配额 403/429）与 EMPTY_RESPONSE 不重试，交给上层降级，
    # 避免 5 次指数退避把 15s 延迟和配额打满。
    retryPolicy:
      mode: normal
      maxRetries: 1
      retryableCodes: [SERVER, TIMEOUT, TRANSPORT]
      backoff:
        initialDelayMs: 300
        maxDelayMs: 2000
        jitterRatio: 0.1
- id: system-prompt
  config:
    # 小精灵人格（默认是 coding agent 人格，必须覆盖；personaSuffix 清空 cwd 提示）
    personaPrefix: 你是藏在寻宝地图里的小精灵，陪孩子一起学语文、数学和英语。
    personaSuffix: ''

# ===== 命令 / 文件 / 网络工具：全部关闭 =====
