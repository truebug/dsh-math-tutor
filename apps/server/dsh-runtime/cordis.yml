# dsh-math-tutor dsh 运行时组合（服务器 /opt/dsh-math-tutor/server/dsh-runtime/）
# stdout 即协议：本文件不得挂任何 stdout logger；诊断走 stderr
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: LLM_API_KEY       # 由宿主进程注入（同 server .env 的 Kimi key）
    baseURL: https://api.kimi.com/coding/v1
    thinking: disabled
    models:
      - id: k3
        name: Kimi-K3
        contextWindow: 262144
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: /var/lib/dsh-tutor/sessions
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'
