name: deploy
# 占位：构建前端静态产物并部署到 nginx 服务器
# 触发方式与服务器凭据（secrets: DEPLOY_HOST / DEPLOY_USER / DEPLOY_KEY）待配置
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # - run: rsync -avz --delete apps/web/dist/ $DEPLOY_USER@$DEPLOY_HOST:/var/www/dsh-math-tutor/
